<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        color: var(--muted-foreground, #999);
        line-height: 1.4;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 12px;
        color: var(--muted-foreground, #999);
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 8px;
        padding: 6px 8px;
        border: 1px solid var(--border, #555);
        border-radius: 6px;
        background: var(--secondary, #2a2a2a);
        color: var(--foreground, #ddd);
        font: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 8px 10px;
        border: 1px solid var(--border, #555);
        border-radius: 6px;
        background: var(--secondary, #2a2a2a);
        color: var(--foreground, #ddd);
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--primary, #3b82f6);
        border-color: transparent;
        color: var(--primary-foreground, #fff);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        min-height: 1.4em;
        color: var(--muted-foreground, #999);
        white-space: pre-wrap;
      }
      code {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Orca AI Team</h1>
    <p>
      Types <code>orca-team start</code> into a terminal you choose. Install the
      skill and put <code>orca-team</code> on PATH first.
    </p>
    <p>
      Third-party plugins cannot use <code>workspace:read</code>, so paste a
      terminal id from <code>orca terminal list --json</code> (field
      <code>handle</code> / <code>id</code>).
    </p>

    <label for="terminalId">Terminal id</label>
    <input id="terminalId" type="text" placeholder="term_…" autocomplete="off" />

    <label for="objective">Objective (optional)</label>
    <input id="objective" type="text" placeholder="Ship feature X" />

    <div class="row">
      <input id="sameTab" type="checkbox" />
      <label for="sameTab" style="margin: 0"
        >Same-tab (all agents in one tab; default is dual: orch + workers)</label
      >
    </div>

    <button id="start" class="primary" disabled>Start AI Team</button>
    <p class="status" id="status"></p>

    <script>
      'use strict'
      var seq = 0
      var pending = {}
      var statusEl = document.getElementById('status')
      var terminalEl = document.getElementById('terminalId')
      var startBtn = document.getElementById('start')

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (!resolve) return
        delete pending[data.requestId]
        resolve(data)
      })

      function syncStartEnabled() {
        startBtn.disabled = !terminalEl.value.trim()
      }

      function buildCommand() {
        var parts = ['orca-team', 'start']
        if (document.getElementById('sameTab').checked) parts.push('--same-tab')
        var goal = document.getElementById('objective').value.trim()
        if (goal) {
          var escaped = goal.replace(/'/g, "'\"'\"'")
          parts.push('--objective', "'" + escaped + "'")
        }
        return parts.join(' ')
      }

      try {
        var saved = localStorage.getItem('orca-ai-team.terminalId')
        if (saved) terminalEl.value = saved
      } catch (_) {}
      syncStartEnabled()
      terminalEl.addEventListener('input', syncStartEnabled)

      startBtn.addEventListener('click', function () {
        var terminalId = terminalEl.value.trim()
        if (!terminalId) return
        try {
          localStorage.setItem('orca-ai-team.terminalId', terminalId)
        } catch (_) {}
        var command = buildCommand()
        statusEl.textContent = 'Sending: ' + command
        call('terminal.sendText', {
          terminalId: terminalId,
          text: command,
          enter: true
        }).then(function (result) {
          if (!result.ok) {
            statusEl.textContent = 'send failed: ' + (result.error || result.errorCode)
            return
          }
          statusEl.textContent =
            'Typed into ' + terminalId + ' (accepted=' + result.value.accepted + '):\n' + command
          call('notifications.show', {
            title: 'AI Team',
            body: result.value.accepted ? 'Start command sent' : 'Send not accepted'
          })
        })
      })

      statusEl.textContent =
        'Paste a terminal id, then Start. Shortcut Mod+Alt+A reuses the last id saved by the worker after a successful start.'
    </script>
  </body>
</html>
